<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALLINONE — One AI. Every project.</title>
<style>
:root{--bg:#0c0c0e;--text:#fafafa;--muted:#a1a1aa;--accent:#a78bfa;--accent2:#818cf8;--card:#18181b;--border:#27272a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:480px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto 18px;color:#fff}
h1{font-size:1.75rem;letter-spacing:-.03em;margin:0 0 8px}
p{color:var(--muted);line-height:1.6;margin:0 0 12px}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
a.btn{display:inline-block;padding:12px 18px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-weight:600;font-size:14px}
a.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.links{margin-top:24px;font-size:13px;color:var(--muted)}
.links a{color:var(--accent);text-decoration:none;margin:0 6px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">A</div>
  <h1>ALLINONE</h1>
  <p><strong>One AI. Every project.</strong></p>
  <p>Demo Mode — no API keys. Dark &amp; light themes. Projects, chat, school, writing &amp; code helpers.</p>
  <div class="btns">
    <a class="btn" href="https://allinone-flickco.vercel.app">Open live app</a>
    <a class="btn secondary" href="https://github.com/camdenl48799-create/allinone">GitHub</a>
  </div>
  <div class="links">
    <a href="https://www.canva.com/d/JGvrsJC69xHHLnK">Canva logo</a>
    ·
    <a href="https://github.com/camdenl48799-create/allinone">Source</a>
  </div>
</div>
</body>
</html>

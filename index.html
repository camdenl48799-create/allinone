<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALLINONE</title>
<style>body{margin:0;background:#111113;color:#a1a1aa;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.s{width:28px;height:28px;border:2px solid #2e2e33;border-top-color:#5b8def;border-radius:50%;animation:r .7s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}</style>
</head><body>
<div style="text-align:center"><div class="s"></div>Loading ALLINONE…</div>
<script>
(async()=>{
  try{
    const [a,b]=await Promise.all([
      fetch('./app-data-1.txt').then(r=>r.text()),
      fetch('./app-data-2.txt').then(r=>r.text())
    ]);
    const bin=Uint8Array.from(atob(a+b),c=>c.charCodeAt(0));
    const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    const text=await new Response(stream).text();
    document.open();document.write(text);document.close();
  }catch(e){
    document.body.innerHTML='<p style="padding:24px;color:#e86a6a;font-family:system-ui">Load failed. Use Chrome, Safari, Firefox, or Edge.<br><small>'+e+'</small></p>';
  }
})();
</script>
</body></html>

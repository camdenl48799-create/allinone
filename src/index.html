<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><title>ALLINONE</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="setup" class="screen hidden"><div class="setup-card"><div class="brand"><span class="logo">A</span><div><strong>ALLINONE</strong><small>by NOT USED INC.</small></div></div><div id="step"></div><div class="progress"><i id="progress"></i></div><div class="actions"><button id="back" class="secondary">Back</button><button id="next">Continue</button></div></div></div>
<div id="app" class="app hidden"><aside><div class="brand side-brand"><span class="logo">A</span><strong>ALLINONE</strong></div><nav><button class="nav active" data-page="chat">⌁ <span>Chat</span></button><button class="nav" data-page="projects">▦ <span>Projects</span></button><button class="nav" data-page="settings">⚙ <span>Settings</span></button></nav><div class="side-bottom"><span class="dot"></span><span id="modeLabel">Local-first</span></div></aside>
<main><header><div><div id="pageTitle">Chat</div><small id="status">Ready</small></div><button id="newChat" class="secondary">＋ New chat</button></header>
<section id="chat" class="page"><div id="messages" class="messages"></div><div class="composer-wrap"><div class="quick"><button data-prompt="Help me plan a project">Plan a project</button><button data-prompt="Explain something simply">Explain simply</button><button data-prompt="Help me write code">Help with code</button></div><form id="composer"><textarea id="input" rows="2" placeholder="Message ALLINONE…" aria-label="Message ALLINONE"></textarea><button class="send" type="submit">↑</button></form><small class="hint">Demo Mode is active. Your chats stay stored locally on this device.</small></div></section>
<section id="projects" class="page hidden"><div class="section-head"><div><h2>Projects</h2><p>Keep your ideas organized locally.</p></div><button id="addProject">＋ New project</button></div><div id="projectGrid" class="grid"></div></section>
<section id="settings" class="page hidden"><div class="settings"><h2>Settings</h2><label>Display name<input id="nameSetting" maxlength="40"></label><label class="check"><input id="safeSetting" type="checkbox"><span><b>Safe Mode</b><small>Keep responses focused on safe, age-appropriate use.</small></span></label><label>AI mode<select id="aiSetting"><option>Demo Mode</option><option>Local Model (coming soon)</option></select></label><button id="saveSettings">Save settings</button><p id="saved" class="saved"></p></div></section></main></div><script src="renderer.js"></script></body></html>

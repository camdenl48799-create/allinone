name: Build ALLINONE Native Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish native x64 EXE
        run: dotnet publish src/ALLINONE/ALLINONE.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: ALLINONE-Windows-x64
          path: src/ALLINONE/bin/Release/net10.0-windows/win-x64/publish/ALLINONE.exe

name: ALLINONE Build Check

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore src/ALLINONE/ALLINONE.csproj
      - name: Build
        run: dotnet build src/ALLINONE/ALLINONE.csproj -c Release --no-restore
